name: Reclassify All Problems

on:
  workflow_dispatch:

jobs:
  reclassify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -q

      - name: Reclassify all problems via LC API (priority-based)
        run: python _dsa-scheduler/reclassify_all.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _dsa-scheduler/problems.json
          git diff --cached --quiet || git commit -m "🤖 Reclassify all problems (priority-based LC API)"
          git push