name: Update DSA Problem Bank

on:
  push:
    branches: [main]
    paths:
      - "Data Structures & Algorithms/**"
      - "542-01-matrix/**"

  # Also allow manual trigger
  workflow_dispatch:

jobs:
  update-problems:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run problem bank updater
        run: python dsa-scheduler/update_problems.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet dsa-scheduler/problems.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated problems.json
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dsa-scheduler/problems.json
          git commit -m "🤖 Auto-update: sync solved status in problems.json"
          git push
